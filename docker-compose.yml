services:
  db:
    image: postgres:18-alpine
    container_name: pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "7474"
      POSTGRES_DB: test_brainiac
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./test_brainiac.sql:/docker-entrypoint-initdb.d/test_brainiac.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_brainiac"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline-mcp-server
    restart: unless-stopped
    env_file:
      - config.env
    environment:
      host: db
      port: "5432"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
