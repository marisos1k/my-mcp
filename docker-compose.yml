services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline-mcp-server
    restart: unless-stopped
    env_file:
      - config.env
    environment:
      # В Docker-сети BrAIniac БД доступна по имени контейнера "db"
      host: db
      port: "5432"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    networks:
      - brainiac-network
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # Внешняя сеть BrAIniac. Имя по умолчанию: <имя_папки_проекта>_brainiac-network
  # Проверить фактическое имя: docker network ls | grep brainiac
  brainiac-network:
    external: true
    name: brainiac_brainiac-network
