<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Platform - Управление API ключами и проектами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 15px 15px 0 0; padding: 20px; }
        .api-key { font-family: monospace; background: #f8f9fa; padding: 15px; border-radius: 8px; word-break: break-all; }
        .token-info { font-size: 12px; color: #6c757d; word-break: break-all; }
        .nav-tabs .nav-link.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; }
        .nav-tabs .nav-link { color: #333; }
        .project-item { cursor: pointer; }
        .pipeline-list { margin-left: 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Заголовок -->
        <div class="text-center mb-4">
            <h1 class="text-white">MCP Platform</h1>
            <p class="text-white-50">Управление проектами, пайплайнами и API ключами</p>
        </div>

        <!-- Регистрация/Логин -->
        <div id="authSection" class="card">
            <div class="card-header">
                <h3 class="mb-0">Доступ к платформе</h3>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs mb-3" id="authTab" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login">Вход</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register">Регистрация</button>
                    </li>
                </ul>
                <div class="tab-content">
                    <!-- Логин -->
                    <div class="tab-pane fade show active" id="login">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" id="loginEmail" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Пароль</label>
                                <input type="password" id="loginPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Войти</button>
                        </form>
                    </div>
                    
                    <!-- Регистрация -->
                    <div class="tab-pane fade" id="register">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" id="registerEmail" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Пароль</label>
                                <input type="password" id="registerPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Панель управления (скрыта до логина) -->
        <div id="dashboardSection" style="display: none;">
            <!-- Информация о пользователе -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-0">Личный кабинет</h3>
                        <small id="userEmail" class="text-white-50"></small>
                    </div>
                    <button class="btn btn-light" onclick="logout()">Выйти</button>
                </div>
            </div>

            <!-- JWT токен -->
            <div class="card">
                <div class="card-body">
                    <h5>Ваш JWT токен</h5>
                    <div class="token-info" id="jwtToken"></div>
                    <button class="btn btn-sm btn-secondary mt-2" onclick="copyToken()">Копировать токен</button>
                </div>
            </div>

            <!-- API Ключи -->
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">API Ключи</h4>
                </div>
                <div class="card-body">
                    <form id="createKeyForm" class="mb-4">
                        <div class="input-group">
                            <input type="text" id="keyName" class="form-control" placeholder="Название ключа (например, Telegram бот)" required>
                            <button type="submit" class="btn btn-success">➕ Создать ключ</button>
                        </div>
                    </form>
                    <div id="apiKeysList">
                        <div class="text-center text-muted">Загрузка...</div>
                    </div>
                </div>
            </div>

            <!-- Проекты и пайплайны -->
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Проекты и пайплайны</h4>
                </div>
                <div class="card-body">
                    <form id="createProjectForm" class="mb-4">
                        <div class="input-group">
                            <input type="text" id="projectName" class="form-control" placeholder="Название проекта" required>
                            <button type="submit" class="btn btn-success">➕ Создать проект</button>
                        </div>
                    </form>
                    <div id="projectsList">
                        <div class="text-center text-muted">Загрузка...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для отображения API ключа -->
    <div class="modal fade" id="keyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ваш API ключ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Сохраните этот ключ! Он будет показан только один раз:</p>
                    <div class="api-key" id="newKeyValue"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="copyNewKey()">Копировать</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для просмотра пайплайна -->
    <div class="modal fade" id="pipelineModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pipelineModalTitle">Детали пайплайна</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="pipelineModalBody">
                    Загрузка...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001';
        let currentToken = localStorage.getItem('token');
        let lastCreatedKey = '';

        // Проверяем авторизацию при загрузке
        if (currentToken) {
            checkAuth();
        }

        async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/auth/me?token=${currentToken}`);
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('userEmail').innerText = user.email;
                    document.getElementById('jwtToken').innerText = currentToken;
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('dashboardSection').style.display = 'block';
                    loadApiKeys();
                    loadProjects();
                } else {
                    localStorage.removeItem('token');
                }
            } catch(e) {
                localStorage.removeItem('token');
            }
        }

        // Регистрация
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const response = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                alert('✅ Регистрация успешна!');
                location.reload();
            } else {
                const error = await response.json();
                alert('❌ Ошибка: ' + error.detail);
            }
        });

        // Логин
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const response = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                alert('✅ Вход выполнен!');
                location.reload();
            } else {
                const error = await response.json();
                alert('❌ Ошибка: ' + error.detail);
            }
        });

        // Создание API ключа
        document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const keyName = document.getElementById('keyName').value;

            const response = await fetch(`${API_URL}/api/keys?token=${currentToken}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key_name: keyName})
            });

            if (response.ok) {
                const data = await response.json();
                lastCreatedKey = data.api_key;
                document.getElementById('newKeyValue').innerText = lastCreatedKey;
                new bootstrap.Modal(document.getElementById('keyModal')).show();
                loadApiKeys();
                document.getElementById('keyName').value = '';
            } else {
                alert('❌ Ошибка создания ключа');
            }
        });

        // Создание проекта
        document.getElementById('createProjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const projectName = document.getElementById('projectName').value;

            const response = await fetch(`${API_URL}/api/projects?token=${currentToken}&name=${encodeURIComponent(projectName)}`, {
                method: 'POST'
            });

            if (response.ok) {
                alert('✅ Проект создан!');
                document.getElementById('projectName').value = '';
                loadProjects();
            } else {
                const error = await response.json();
                alert('❌ Ошибка: ' + error.detail);
            }
        });

        // Загрузка списка API ключей
        async function loadApiKeys() {
            const response = await fetch(`${API_URL}/api/keys?token=${currentToken}`);
            if (response.ok) {
                const keys = await response.json();
                if (keys.length === 0) {
                    document.getElementById('apiKeysList').innerHTML = '<div class="alert alert-info">У вас пока нет API ключей. Создайте первый!</div>';
                } else {
                    let html = '<div class="list-group">';
                    keys.forEach(key => {
                        html += `
                            <div class="list-group-item">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <strong>${key.key_name}</strong>
                                        <br>
                                        <small class="text-muted">Префикс: ${key.key_prefix}...</small>
                                        <br>
                                        <small class="text-muted">Создан: ${new Date(key.created_at).toLocaleString()}</small>
                                        ${key.last_used_at ? `<br><small class="text-muted">Последний раз: ${new Date(key.last_used_at).toLocaleString()}</small>` : ''}
                                    </div>
                                    <span class="badge ${key.is_active ? 'bg-success' : 'bg-danger'}">
                                        ${key.is_active ? 'Активен' : 'Отозван'}
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    document.getElementById('apiKeysList').innerHTML = html;
                }
            }
        }

        // Загрузка списка проектов
        async function loadProjects() {
            const response = await fetch(`${API_URL}/api/projects?token=${currentToken}`);
            if (response.ok) {
                const projects = await response.json();
                if (projects.length === 0) {
                    document.getElementById('projectsList').innerHTML = '<div class="alert alert-info">У вас пока нет проектов. Создайте первый!</div>';
                } else {
                    let html = '<div class="accordion" id="projectsAccordion">';
                    projects.forEach((project, index) => {
                        html += `
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="heading${index}">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${index}" aria-expanded="false" aria-controls="collapse${index}">
                                        <strong>${project.name}</strong>
                                    </button>
                                </h2>
                                <div id="collapse${index}" class="accordion-collapse collapse" aria-labelledby="heading${index}" data-bs-parent="#projectsAccordion">
                                    <div class="accordion-body">
                                        <div id="pipelines-${project.id}">
                                            <div class="text-center text-muted">Загрузка пайплайнов...</div>
                                        </div>
                                        <button class="btn btn-sm btn-primary mt-2" onclick="createPipeline(${project.id})">
                                            ➕ Создать пайплайн
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    document.getElementById('projectsList').innerHTML = html;
                    
                    // Загружаем пайплайны для каждого проекта при открытии аккордеона
                    projects.forEach(project => {
                        const accordionButton = document.querySelector(`#heading${projects.indexOf(project)} .accordion-button`);
                        accordionButton.addEventListener('click', () => {
                            loadPipelines(project.id);
                        });
                    });
                }
            }
        }

        // Загрузка пайплайнов для проекта
        async function loadPipelines(projectId) {
            const container = document.getElementById(`pipelines-${projectId}`);
            if (container.innerHTML.includes('Загрузка пайплайнов')) {
                const response = await fetch(`${API_URL}/api/projects/${projectId}/pipelines?token=${currentToken}`);
                if (response.ok) {
                    const pipelines = await response.json();
                    if (pipelines.length === 0) {
                        container.innerHTML = '<div class="alert alert-info">В этом проекте нет пайплайнов</div>';
                    } else {
                        let html = '<div class="list-group">';
                        pipelines.forEach(p => {
                            html += `
                                <div class="list-group-item">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <strong>${p.name}</strong>
                                            ${p.report ? `<br><small class="text-muted">${p.report}</small>` : ''}
                                            <br>
                                            <small>Score: ${p.score || 'Нет'}</small>
                                            ${p.max_time ? `<br><small>Макс. время: ${p.max_time}</small>` : ''}
                                            ${p.max_cost ? `<br><small>Макс. стоимость: ${p.max_cost}</small>` : ''}
                                        </div>
                                        <button class="btn btn-sm btn-outline-info" onclick="viewPipeline(${p.id})">
                                            Подробнее
                                        </button>
                                    </div>
                                </div>
                            `;
                        });
                        html += '</div>';
                        container.innerHTML = html;
                    }
                }
            }
        }

        // Просмотр деталей пайплайна
        async function viewPipeline(pipelineId) {
            const modal = new bootstrap.Modal(document.getElementById('pipelineModal'));
            document.getElementById('pipelineModalTitle').innerText = 'Загрузка...';
            document.getElementById('pipelineModalBody').innerHTML = '<div class="text-center">Загрузка данных пайплайна...</div>';
            modal.show();
            
            const response = await fetch(`${API_URL}/api/pipelines/${pipelineId}?token=${currentToken}`);
            if (response.ok) {
                const pipeline = await response.json();
                document.getElementById('pipelineModalTitle').innerText = pipeline.name;
                let html = `
                    <p><strong>Проект:</strong> ${pipeline.project_name || 'Не указан'}</p>
                    <p><strong>Описание:</strong> ${pipeline.report || 'Нет описания'}</p>
                    <p><strong>Макс. время:</strong> ${pipeline.max_time || 'Не указано'}</p>
                    <p><strong>Макс. стоимость:</strong> ${pipeline.max_cost || 'Не указано'}</p>
                    <p><strong>Макс. % отказов:</strong> ${pipeline.max_fail_percent || 'Не указано'}</p>
                    <p><strong>Score:</strong> ${pipeline.score || 'Не указан'}</p>
                    <p><strong>Создан:</strong> ${new Date(pipeline.created_at).toLocaleString()}</p>
                `;
                document.getElementById('pipelineModalBody').innerHTML = html;
            } else {
                document.getElementById('pipelineModalBody').innerHTML = '<div class="alert alert-danger">Ошибка загрузки данных</div>';
            }
        }

        // Создание пайплайна (заглушка)
        async function createPipeline(projectId) {
            const name = prompt('Введите название пайплайна:');
            if (!name) return;
            
            const report = prompt('Введите описание (необязательно):', '');
            const max_time = prompt('Максимальное время (например, 1 hour, 30 minutes):', '');
            const max_cost = prompt('Максимальная стоимость:', '');
            
            const params = new URLSearchParams({
                name: name,
                token: currentToken
            });
            if (report) params.append('report', report);
            if (max_time) params.append('max_time', max_time);
            if (max_cost) params.append('max_cost', max_cost);
            
            const response = await fetch(`${API_URL}/api/projects/${projectId}/pipelines?${params.toString()}`, {
                method: 'POST'
            });
            
            if (response.ok) {
                alert('✅ Пайплайн создан!');
                // Обновляем список пайплайнов в этом проекте
                loadPipelines(projectId);
            } else {
                const error = await response.json();
                alert('❌ Ошибка: ' + error.detail);
            }
        }

        function copyToken() {
            navigator.clipboard.writeText(currentToken);
            alert('✅ JWT токен скопирован!');
        }

        function copyNewKey() {
            navigator.clipboard.writeText(lastCreatedKey);
            alert('✅ API ключ скопирован!');
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
